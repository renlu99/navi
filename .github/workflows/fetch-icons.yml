name: Fetch shortcut icons

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-shortcut-icons
  cancel-in-progress: false

jobs:
  fetch-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch missing icons from navi-data
        env:
          PYTHONUNBUFFERED: '1'
          NAVI_DATA_REPO: renlu99/navi-data
          NAVI_DATA_BRANCH: main
          NAVI_DATA_PATH: shortcuts.json
          NAVI_DATA_TOKEN: ${{ secrets.NAVI_DATA_TOKEN }}
        run: python scripts/fetch_icons.py

      - name: Commit hosted icons
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No icon changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-manifest.json icons
          git commit -m "保存快捷方式图标"
          git push
