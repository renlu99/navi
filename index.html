<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://www.google.com" crossorigin>
  <title>仁露的快捷导航</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <h1>仁露的快捷导航</h1>
      </div>
      <div class="actions">
        <button id="importButton" type="button">导入</button>
        <button id="exportButton" type="button">导出</button>
        <button id="githubButton" type="button" aria-label="GitHub 同步设置">GitHub</button>
        <input id="importInput" type="file" accept="application/json,.json" hidden>
      </div>
    </header>

    <section class="shortcut-grid" id="shortcutGrid" aria-live="polite"></section>
  </main>

  <dialog class="dialog" id="shortcutDialog">
    <form id="shortcutForm" method="dialog">
      <button class="dialog-close" id="closeDialogButton" type="button" aria-label="关闭">×</button>
      <h2 id="dialogTitle">添加快捷方式</h2>
      <input id="shortcutId" type="hidden">
      <label>名称<input id="nameInput" maxlength="40" placeholder="留空自动使用网址名称"></label>
      <label>网址<input id="urlInput" type="text" inputmode="url" maxlength="2000" placeholder="example.com" required></label>
      <div class="dialog-actions">
        <button class="cancel-button" id="cancelDialogButton" type="button">取消</button>
        <button class="save-button" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="githubDialog">
    <form id="githubForm">
      <button class="dialog-close" id="closeGithubDialogButton" type="button" aria-label="关闭">×</button>
      <h2>GitHub 同步</h2>
      <p class="login-copy">Token 只保存在当前设备浏览器中，用于把 shortcuts.json 写回指定仓库。</p>
      <label>用户名<input id="githubOwnerInput" autocomplete="username" placeholder="renlu99" required></label>
      <label>仓库<input id="githubRepoInput" autocomplete="off" placeholder="navi" required></label>
      <label>分支<input id="githubBranchInput" autocomplete="off" value="main" required></label>
      <label>文件路径<input id="githubPathInput" autocomplete="off" value="shortcuts.json" required></label>
      <label>Fine-grained Token<input id="githubTokenInput" type="password" autocomplete="new-password" placeholder="github_pat_…"></label>
      <p class="github-help">Token 需要只授权此仓库的 Contents: Read and write。留空可读取公开仓库，但不能自动保存。</p>
      <p class="login-error" id="githubError"></p>
      <div class="dialog-actions">
        <button class="cancel-button" id="clearGithubButton" type="button">清除 Token</button>
        <button class="cancel-button" id="cancelGithubDialogButton" type="button">取消</button>
        <button class="save-button" type="submit">保存并读取</button>
      </div>
    </form>
  </dialog>

  <div class="card-menu" id="cardMenu" hidden>
    <button id="editButton" type="button">编辑</button>
    <button id="moveButton" type="button">移动</button>
    <button id="deleteButton" class="danger" type="button">删除</button>
  </div>
  <div class="toast" id="toast"></div>
  <script src="app.js?v=11" defer></script>
</body>
</html>
